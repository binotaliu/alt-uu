# Fresh install → onboarding → login with ${MAESTRO_USERNAME}. Ends on the
# course list. Used by every top-level flow.
appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: onboarding-continue
    timeout: 30000
- repeat:
    while:
      visible:
        id: onboarding-continue
    commands:
      - tapOn:
          id: onboarding-continue
- extendedWaitUntil:
    visible:
      id: login-username
    timeout: 15000
- tapOn:
    id: login-username
- inputText: ${MAESTRO_USERNAME}
- tapOn:
    id: login-password
- inputText: ${MAESTRO_PASSWORD}
- hideKeyboard
- tapOn:
    id: login-submit
- extendedWaitUntil:
    visible:
      id: course-row
    timeout: 60000
