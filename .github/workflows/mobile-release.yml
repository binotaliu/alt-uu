name: Mobile Build & Release

# build-android / build-ios always run on push to main (and on manual dispatch of
# any branch), producing signed but unpublished artifacts for inspection/QA.
#
# publish-android / publish-ios only run on push to main, or a manual dispatch
# with "publish" checked. They sit behind the `release` GitHub Environment, which
# requires a manual approval click before the job starts - see README/setup docs
# for configuring the required reviewer via `scripts/setup-github-secrets.sh`.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Also upload to App Store Connect / Play Store (internal track) after building'
        type: boolean
        default: false
      jump_by:
        description: >
          iOS only (native:package --jump-by). Extra amount to add on top of the
          App Store Connect-suggested next build number. Use this when releasing
          a marketing version that has never been uploaded to App Store Connect
          before: Apple's build-number lookup only checks builds already used
          *for that exact version string*, so a brand new version otherwise
          restarts at build 1 and can collide with earlier, higher build
          numbers. Play Store doesn't need this - its lookup already scans
          every build across the whole app, regardless of version.
        type: string
        default: ''

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  determine-version:
    name: Determine app version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      display_version: ${{ steps.version.outputs.display_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine version from most recent tag
        id: version
        run: |
          set -euo pipefail

          tag=$(git describe --tags --abbrev=0)
          version=$(printf '%s' "$tag" | sed -E 's/^v//' | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
          display_version=$(git describe --tags)

          if [ -z "$version" ]; then
            echo "Could not extract a x.y.z version from tag '$tag'" >&2
            exit 1
          fi

          echo "Tag: $tag"
          echo "App version: $version"
          echo "Display version: $display_version"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "display_version=${display_version}" >> "$GITHUB_OUTPUT"

  build-android:
    name: Build Android (unsigned upload)
    needs: determine-version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-nativephp-build
        with:
          production-env: ${{ secrets.ALTUU_PRODUCTION_ENV }}
          app-id: org.binota.alt_uu
          app-version: ${{ needs.determine-version.outputs.version }}
          display-version: ${{ needs.determine-version.outputs.display_version }}
          ios-certificate-base64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          ios-provisioning-profile-base64: ${{ secrets.IOS_DISTRIBUTION_PROVISIONING_PROFILE_BASE64 }}
          app-store-api-key-base64: ${{ secrets.APP_STORE_API_KEY_P8_BASE64 }}
          android-keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          google-service-account-key-base64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_BASE64 }}

      - name: Build frontend assets
        run: npm run build -- --mode=android

      - name: Install NativePHP Android project
        run: rm -Rf nativephp/android && php artisan native:install --force android

      - name: Package signed Android bundle
        run: php artisan native:package android --build-type=bundle --output=build-output --rebuild --no-tty

      # native:package can swallow a Gradle/packaging failure and still exit 0
      # (its error paths return without setting Command::FAILURE), so check
      # for the artifact explicitly instead of trusting the step's exit code.
      # On failure, re-run gradlew directly (bypassing native:package's PHP
      # Process::run(), which captures Gradle's output without ever printing
      # it) so the real compile/build error actually reaches the CI log.
      - name: Verify AAB was produced
        run: |
          set -euo pipefail
          if ! compgen -G "build-output/*.aab" > /dev/null; then
            echo "::error::No .aab found in build-output/ - native:package likely failed silently."
            echo "Re-running gradlew directly for a real error message:"
            (cd nativephp/android && ./gradlew bundleRelease --stacktrace) || true
            exit 1
          fi
          ls -la build-output/

      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build-output/*.aab
          retention-days: 14

  build-ios:
    name: Build iOS (unsigned upload)
    needs: determine-version
    # macos-15's Xcode doesn't have the UIWindow corner-adaptation API used by
    # plugin-nativephp-patch's ContentView.swift patch; macos-26 ships the
    # Xcode/SDK that supports it.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-nativephp-build
        with:
          production-env: ${{ secrets.ALTUU_PRODUCTION_ENV }}
          app-id: org.binota.alt-uu
          app-version: ${{ needs.determine-version.outputs.version }}
          display-version: ${{ needs.determine-version.outputs.display_version }}
          ios-certificate-base64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          ios-provisioning-profile-base64: ${{ secrets.IOS_DISTRIBUTION_PROVISIONING_PROFILE_BASE64 }}
          app-store-api-key-base64: ${{ secrets.APP_STORE_API_KEY_P8_BASE64 }}
          android-keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          google-service-account-key-base64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_BASE64 }}

      - name: Build frontend assets
        run: npm run build -- --mode=ios

      - name: Install NativePHP iOS project
        run: rm -Rf nativephp/ios && php artisan native:install --force ios

      - name: Package signed iOS archive
        run: php artisan native:package ios --export-method=app-store --output=build-output --rebuild --no-tty

      # See the matching Android step: native:package can swallow a build
      # failure and still exit 0, so verify the artifact exists explicitly.
      - name: Verify IPA was produced
        run: |
          set -euo pipefail
          if ! compgen -G "build-output/*.ipa" > /dev/null; then
            echo "::error::No .ipa found in build-output/ - native:package likely failed silently. Archive/export contents:"
            find nativephp/ios/build -maxdepth 3 2>/dev/null || echo "(nativephp/ios/build does not exist)"
            exit 1
          fi
          ls -la build-output/

      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build-output/*.ipa
          retention-days: 14

  publish-android:
    name: Publish Android to Play Store (internal)
    needs: [determine-version, build-android]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    environment: release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-nativephp-build
        with:
          production-env: ${{ secrets.ALTUU_PRODUCTION_ENV }}
          app-id: org.binota.alt_uu
          app-version: ${{ needs.determine-version.outputs.version }}
          display-version: ${{ needs.determine-version.outputs.display_version }}
          ios-certificate-base64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          ios-provisioning-profile-base64: ${{ secrets.IOS_DISTRIBUTION_PROVISIONING_PROFILE_BASE64 }}
          app-store-api-key-base64: ${{ secrets.APP_STORE_API_KEY_P8_BASE64 }}
          android-keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          google-service-account-key-base64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_BASE64 }}

      - name: Build frontend assets
        run: npm run build -- --mode=android

      - name: Install NativePHP Android project
        run: rm -Rf nativephp/android && php artisan native:install --force android

      - name: Package, sign and upload to Play Store internal testing
        # No --jump-by here: Play Store's build-number lookup already scans every
        # edit/track across the whole app (see PublishesToPlayStore::getLatestPlayStoreVersionCode),
        # so "latest + 1" is always safe regardless of version name.
        run: php artisan native:package android --build-type=bundle --output=build-output --upload-to-play-store --play-store-track=internal --rebuild --no-tty

      # native:package can swallow a Gradle/upload failure and still exit 0
      # (its error paths return without setting Command::FAILURE), so check
      # for the artifact explicitly instead of trusting the step's exit code.
      - name: Verify AAB was produced and uploaded
        run: |
          set -euo pipefail
          if ! compgen -G "build-output/*.aab" > /dev/null; then
            echo "::error::No .aab found in build-output/ - native:package likely failed silently (Gradle build and/or Play Store upload)."
            echo "Re-running gradlew directly for a real error message:"
            (cd nativephp/android && ./gradlew bundleRelease --stacktrace) || true
            exit 1
          fi
          ls -la build-output/

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-signed
          path: build-output/*.aab
          retention-days: 90

  publish-ios:
    name: Publish iOS to App Store Connect
    needs: [determine-version, build-ios]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    environment: release
    # See build-ios: macos-26 has the Xcode/SDK the native patch needs.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-nativephp-build
        with:
          production-env: ${{ secrets.ALTUU_PRODUCTION_ENV }}
          app-id: org.binota.alt-uu
          app-version: ${{ needs.determine-version.outputs.version }}
          display-version: ${{ needs.determine-version.outputs.display_version }}
          ios-certificate-base64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          ios-provisioning-profile-base64: ${{ secrets.IOS_DISTRIBUTION_PROVISIONING_PROFILE_BASE64 }}
          app-store-api-key-base64: ${{ secrets.APP_STORE_API_KEY_P8_BASE64 }}
          android-keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          google-service-account-key-base64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_BASE64 }}

      - name: Build frontend assets
        run: npm run build -- --mode=ios

      - name: Install NativePHP iOS project
        run: rm -Rf nativephp/ios && php artisan native:install --force ios

      - name: Package, sign and upload to App Store Connect
        # macOS runners ship bash 3.2, where "${arr[@]}" on a *declared but
        # empty* array trips `set -u`'s unbound-variable check (fixed upstream
        # only in bash 4.4+). Guard the expansion with a length check instead
        # of relying on the array being safely empty-expandable.
        run: |
          set -euo pipefail
          jump_by_flag=()
          if [ -n "${JUMP_BY:-}" ]; then
            jump_by_flag=(--jump-by="$JUMP_BY")
          fi
          if [ "${#jump_by_flag[@]}" -gt 0 ]; then
            php artisan native:package ios --export-method=app-store --output=build-output --upload-to-app-store --rebuild --no-tty "${jump_by_flag[@]}"
          else
            php artisan native:package ios --export-method=app-store --output=build-output --upload-to-app-store --rebuild --no-tty
          fi
        env:
          JUMP_BY: ${{ inputs.jump_by }}

      # See the matching Android step: native:package can swallow a build or
      # upload failure and still exit 0, so verify the artifact exists explicitly.
      - name: Verify IPA was produced and uploaded
        run: |
          set -euo pipefail
          if ! compgen -G "build-output/*.ipa" > /dev/null; then
            echo "::error::No .ipa found in build-output/ - native:package likely failed silently (build and/or App Store Connect upload). Archive/export contents:"
            find nativephp/ios/build -maxdepth 3 2>/dev/null || echo "(nativephp/ios/build does not exist)"
            exit 1
          fi
          ls -la build-output/

      - uses: actions/upload-artifact@v4
        with:
          name: ios-release-signed
          path: build-output/*.ipa
          retention-days: 90

  github-release:
    name: Create GitHub release
    needs: [determine-version, publish-android, publish-ios]
    if: always() && needs.publish-android.result == 'success' && needs.publish-ios.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: android-release-signed
          path: release-assets

      - uses: actions/download-artifact@v4
        with:
          name: ios-release-signed
          path: release-assets

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.determine-version.outputs.version }}
          DISPLAY_VERSION: ${{ needs.determine-version.outputs.display_version }}
        run: |
          gh release create "mobile-v${VERSION}-${{ github.run_number }}" \
            release-assets/*.aab release-assets/*.ipa \
            --title "Mobile release ${DISPLAY_VERSION} (build ${{ github.run_number }})" \
            --notes "Automated mobile release from commit ${{ github.sha }}. Uploaded to Play Store internal testing and App Store Connect." \
            --target "${{ github.sha }}"
