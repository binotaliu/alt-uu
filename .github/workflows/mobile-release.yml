name: Mobile Build & Release

# build-android / build-ios always run on push to main (and on manual dispatch of
# any branch), producing signed but unpublished artifacts for inspection/QA.
#
# publish-android / publish-ios only run on push to main, or a manual dispatch
# with "publish" checked. They sit behind the `release` GitHub Environment, which
# requires a manual approval click before the job starts - see README/setup docs
# for configuring the required reviewer via `scripts/setup-github-secrets.sh`.
#
# Pipeline: expo prebuild -> fastlane (apps/mobile/fastlane; its README lists the
# required secrets and a dry-run checklist).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Also upload to App Store Connect / Play Store (internal track) after building'
        type: boolean
        default: false
      jump_by:
        description: >
          iOS only. Extra amount to add on top of the
          App Store Connect-suggested next build number. Use this when releasing
          a marketing version that has never been uploaded to App Store Connect
          before: Apple's build-number lookup only checks builds already used
          *for that exact version string*, so a brand new version otherwise
          restarts at build 1 and can collide with earlier, higher build
          numbers. Play Store doesn't need this - its lookup already scans
          every build across the whole app, regardless of version.
        type: string
        default: ''

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  determine-version:
    name: Determine app version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      display_version: ${{ steps.version.outputs.display_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine version from most recent tag
        id: version
        run: |
          set -euo pipefail

          tag=$(git describe --tags --abbrev=0)
          version=$(printf '%s' "$tag" | sed -E 's/^v//' | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
          display_version=$(git describe --tags)

          if [ -z "$version" ]; then
            echo "Could not extract a x.y.z version from tag '$tag'" >&2
            exit 1
          fi

          echo "Tag: $tag"
          echo "App version: $version"
          echo "Display version: $display_version"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "display_version=${display_version}" >> "$GITHUB_OUTPUT"

  build-android:
    name: Build Android (unpublished)
    needs: determine-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-expo-build
        with:
          platform: android
          production-env: ${{ secrets.ALTUU_PRODUCTION_ENV }}
          app-version: ${{ needs.determine-version.outputs.version }}
          display-version: ${{ needs.determine-version.outputs.display_version }}
          build-number: ${{ github.run_number }}
          android-keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          google-service-account-key-base64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_BASE64 }}

      - name: Generate native android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean

      - name: Build signed Android bundle
        working-directory: apps/mobile
        run: bundle exec fastlane android build_bundle

      # fastlane failures fail the step, but check the artifact explicitly so a
      # silent no-op can never look like a release.
      - name: Verify *.aab was produced
        run: |
          set -euo pipefail
          if ! compgen -G "apps/mobile/fastlane/build-output/*.aab" > /dev/null; then
            echo "::error::No *.aab found in apps/mobile/fastlane/build-output/."
            exit 1
          fi
          ls -la apps/mobile/fastlane/build-output/

      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: apps/mobile/fastlane/build-output/*.aab
          retention-days: 14

  build-ios:
    name: Build iOS (unpublished)
    needs: determine-version
    # Expo SDK 58 / RN 0.88 need a current Xcode; macos-26 ships the newest SDK.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-expo-build
        with:
          platform: ios
          production-env: ${{ secrets.ALTUU_PRODUCTION_ENV }}
          app-version: ${{ needs.determine-version.outputs.version }}
          display-version: ${{ needs.determine-version.outputs.display_version }}
          build-number: ${{ github.run_number }}
          ios-certificate-base64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          ios-provisioning-profile-base64: ${{ secrets.IOS_DISTRIBUTION_PROVISIONING_PROFILE_BASE64 }}
          app-store-api-key-base64: ${{ secrets.APP_STORE_API_KEY_P8_BASE64 }}

      - name: Generate native ios project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean

      - name: Archive and export signed iOS app
        working-directory: apps/mobile
        run: bundle exec fastlane ios build_ipa

      # fastlane failures fail the step, but check the artifact explicitly so a
      # silent no-op can never look like a release.
      - name: Verify *.ipa was produced
        run: |
          set -euo pipefail
          if ! compgen -G "apps/mobile/fastlane/build-output/*.ipa" > /dev/null; then
            echo "::error::No *.ipa found in apps/mobile/fastlane/build-output/."
            exit 1
          fi
          ls -la apps/mobile/fastlane/build-output/

      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: apps/mobile/fastlane/build-output/*.ipa
          retention-days: 14

  publish-android:
    name: Publish Android to Play Store (internal)
    needs: [determine-version, build-android]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    environment: release
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.export_version_code.outputs.version_code }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-expo-build
        with:
          platform: android
          production-env: ${{ secrets.ALTUU_PRODUCTION_ENV }}
          app-version: ${{ needs.determine-version.outputs.version }}
          display-version: ${{ needs.determine-version.outputs.display_version }}
          android-keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          google-service-account-key-base64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_BASE64 }}

      # Play Store's lookup scans every track across the whole app, so
      # "highest + 1" is always safe regardless of version name (no jump_by).

      - name: Sync build number with Play Store
        id: build_number
        working-directory: apps/mobile
        run: bundle exec fastlane android sync_build_number

      # Export for expo prebuild (it bakes the number into the native project)
      # and fail early if the sync did not yield a number.
      - name: Export build number
        run: |
          set -euo pipefail
          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Play Store sync did not produce a numeric build number."
            exit 1
          fi
          echo "APP_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Build number: $BUILD_NUMBER"
        env:
          BUILD_NUMBER: ${{ steps.build_number.outputs.build_number }}

      # Exposed so the sideload APK job reuses the exact same version code.
      - name: Export version code
        id: export_version_code
        run: echo "version_code=$APP_BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Generate native android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean

      - name: Build, sign and upload to Play Store internal testing
        working-directory: apps/mobile
        run: bundle exec fastlane android release

      # fastlane failures fail the step, but check the artifact explicitly so a
      # silent no-op can never look like a release.
      - name: Verify *.aab was produced
        run: |
          set -euo pipefail
          if ! compgen -G "apps/mobile/fastlane/build-output/*.aab" > /dev/null; then
            echo "::error::No *.aab found in apps/mobile/fastlane/build-output/."
            exit 1
          fi
          ls -la apps/mobile/fastlane/build-output/

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-signed
          path: apps/mobile/fastlane/build-output/*.aab
          retention-days: 90

  # Signed with a dedicated sideload key (NOT the Play upload key), so it is a
  # separate install channel from the Play Store build. Runs after the Play
  # publish (and its approval) and reuses that build's version code.
  build-android-sideload:
    name: Build Android sideload APK
    needs: [determine-version, publish-android]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-expo-build
        with:
          platform: android
          production-env: ${{ secrets.ALTUU_PRODUCTION_ENV }}
          app-version: ${{ needs.determine-version.outputs.version }}
          display-version: ${{ needs.determine-version.outputs.display_version }}
          build-number: ${{ needs.publish-android.outputs.version_code }}
          android-keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          google-service-account-key-base64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_BASE64 }}

      - name: Generate native android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean

      - name: Decode sideload keystore
        run: |
          set -euo pipefail
          printf '%s' "$SIDELOAD_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/credentials/sideload.p12"
          echo "SIDELOAD_KEYSTORE_PATH=$RUNNER_TEMP/credentials/sideload.p12" >> "$GITHUB_ENV"
        env:
          SIDELOAD_KEYSTORE: ${{ secrets.ANDROID_SIDELOAD_KEYSTORE_BASE64 }}

      - name: Build sideload APK
        working-directory: apps/mobile
        run: bundle exec fastlane android build_sideload
        env:
          SIDELOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIDELOAD_KEYSTORE_PASSWORD }}
          SIDELOAD_KEY_ALIAS: ${{ secrets.ANDROID_SIDELOAD_KEY_ALIAS }}

      # Check the artifact exists and that it is signed with the sideload key,
      # not the Play upload key.
      - name: Verify APK and signing certificate
        run: |
          set -euo pipefail
          apk=apps/mobile/fastlane/build-output/alt-uu-sideload.apk
          if [ ! -f "$apk" ]; then
            echo "::error::No sideload APK produced."
            exit 1
          fi
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$apksigner" verify --print-certs "$apk" | tee certs.txt
          actual=$(sed -nE 's/.*certificate SHA-256 digest: ([0-9a-f]+).*/\1/p' certs.txt | head -n1 | tr -d ':' | tr 'a-f' 'A-F')
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::APK is not signed with the sideload key (got $actual)."
            exit 1
          fi
        env:
          EXPECTED_SHA256: E45CA611489F0DF8A957458206C015FF7B6131ACB7308F693D2B75BE3AA2DD9D

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: apps/mobile/fastlane/build-output/alt-uu-sideload.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-sideload-apk
          path: apps/mobile/fastlane/build-output/alt-uu-sideload.apk
          retention-days: 90

  publish-ios:
    name: Publish iOS to App Store Connect
    needs: [determine-version, build-ios]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    environment: release
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-expo-build
        with:
          platform: ios
          production-env: ${{ secrets.ALTUU_PRODUCTION_ENV }}
          app-version: ${{ needs.determine-version.outputs.version }}
          display-version: ${{ needs.determine-version.outputs.display_version }}
          ios-certificate-base64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          ios-provisioning-profile-base64: ${{ secrets.IOS_DISTRIBUTION_PROVISIONING_PROFILE_BASE64 }}
          app-store-api-key-base64: ${{ secrets.APP_STORE_API_KEY_P8_BASE64 }}

      # App Store Connect's lookup only covers builds of this exact version
      # string, so jump_by is added on top (and alone, for a never-seen version).

      - name: Sync build number with App Store Connect
        id: build_number
        working-directory: apps/mobile
        run: bundle exec fastlane ios sync_build_number
        env:
          JUMP_BY: ${{ inputs.jump_by }}

      # Export for expo prebuild (it bakes the number into the native project)
      # and fail early if the sync did not yield a number.
      - name: Export build number
        run: |
          set -euo pipefail
          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::App Store Connect sync did not produce a numeric build number."
            exit 1
          fi
          echo "APP_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Build number: $BUILD_NUMBER"
        env:
          BUILD_NUMBER: ${{ steps.build_number.outputs.build_number }}

      - name: Generate native ios project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean

      - name: Build, sign and upload to App Store Connect
        working-directory: apps/mobile
        run: bundle exec fastlane ios release

      # fastlane failures fail the step, but check the artifact explicitly so a
      # silent no-op can never look like a release.
      - name: Verify *.ipa was produced
        run: |
          set -euo pipefail
          if ! compgen -G "apps/mobile/fastlane/build-output/*.ipa" > /dev/null; then
            echo "::error::No *.ipa found in apps/mobile/fastlane/build-output/."
            exit 1
          fi
          ls -la apps/mobile/fastlane/build-output/

      - uses: actions/upload-artifact@v4
        with:
          name: ios-release-signed
          path: apps/mobile/fastlane/build-output/*.ipa
          retention-days: 90

  github-release:
    name: Create GitHub release
    needs: [determine-version, publish-android, publish-ios, build-android-sideload]
    if: always() && needs.publish-android.result == 'success' && needs.publish-ios.result == 'success' && needs.build-android-sideload.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: android-release-signed
          path: release-assets

      - uses: actions/download-artifact@v4
        with:
          name: ios-release-signed
          path: release-assets

      - uses: actions/download-artifact@v4
        with:
          name: android-sideload-apk
          path: release-assets

      # The AAB/IPA are re-signed by Google/Apple on their way to users, so
      # these attest what CI produced, not what the stores serve. The APK is
      # attested in its own job and is what users can verify end to end.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release-assets/*.aab
            release-assets/*.ipa

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.determine-version.outputs.version }}
          DISPLAY_VERSION: ${{ needs.determine-version.outputs.display_version }}
        run: |
          gh release create "mobile-v${VERSION}-${{ github.run_number }}" \
            release-assets/*.aab release-assets/*.ipa release-assets/*.apk \
            --title "Mobile release ${DISPLAY_VERSION} (build ${{ github.run_number }})" \
            --notes "Automated mobile release from commit ${{ github.sha }}. Uploaded to Play Store internal testing and App Store Connect. The APK is a separate sideload build; see the README for how to verify it." \
            --target "${{ github.sha }}"
