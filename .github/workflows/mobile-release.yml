name: Mobile Build & Release

# build-android / build-ios always run on push to main (and on manual dispatch of
# any branch), producing signed but unpublished artifacts for inspection/QA.
#
# publish-android / publish-ios only run on push to main, or a manual dispatch
# with "publish" checked. They sit behind the `release` GitHub Environment, which
# requires a manual approval click before the job starts - see README/setup docs
# for configuring the required reviewer via `scripts/setup-github-secrets.sh`.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Also upload to App Store Connect / Play Store (internal track) after building'
        type: boolean
        default: false
      jump_by:
        description: >
          iOS only (native:package --jump-by). Extra amount to add on top of the
          App Store Connect-suggested next build number. Use this when releasing
          a marketing version that has never been uploaded to App Store Connect
          before: Apple's build-number lookup only checks builds already used
          *for that exact version string*, so a brand new version otherwise
          restarts at build 1 and can collide with earlier, higher build
          numbers. Play Store doesn't need this - its lookup already scans
          every build across the whole app, regardless of version.
        type: string
        default: ''

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  determine-version:
    name: Determine app version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      display_version: ${{ steps.version.outputs.display_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine version from most recent tag
        id: version
        run: |
          set -euo pipefail

          tag=$(git describe --tags --abbrev=0)
          version=$(printf '%s' "$tag" | sed -E 's/^v//' | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
          display_version=$(git describe --tags)

          if [ -z "$version" ]; then
            echo "Could not extract a x.y.z version from tag '$tag'" >&2
            exit 1
          fi

          echo "Tag: $tag"
          echo "App version: $version"
          echo "Display version: $display_version"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "display_version=${display_version}" >> "$GITHUB_OUTPUT"

  build-android:
    name: Build Android (unsigned upload)
    needs: determine-version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-nativephp-build
        with:
          production-env: ${{ secrets.ALTUU_PRODUCTION_ENV }}
          app-id: org.binota.alt_uu
          app-version: ${{ needs.determine-version.outputs.version }}
          display-version: ${{ needs.determine-version.outputs.display_version }}
          ios-certificate-base64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          ios-provisioning-profile-base64: ${{ secrets.IOS_DISTRIBUTION_PROVISIONING_PROFILE_BASE64 }}
          app-store-api-key-base64: ${{ secrets.APP_STORE_API_KEY_P8_BASE64 }}
          android-keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          google-service-account-key-base64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_BASE64 }}

      - name: Install NativePHP Android project
        run: rm -Rf nativephp/android && php artisan native:install --force android

      - name: Package signed Android bundle
        run: php artisan native:package android --build-type=bundle --output=build-output --rebuild --no-tty

      # native:package can swallow a Gradle/packaging failure and still exit 0
      # (its error paths return without setting Command::FAILURE), so check
      # for the artifact explicitly instead of trusting the step's exit code.
      # On failure, re-run gradlew directly (bypassing native:package's PHP
      # Process::run(), which captures Gradle's output without ever printing
      # it) so the real compile/build error actually reaches the CI log.
      - name: Verify AAB was produced
        run: |
          set -euo pipefail
          if ! compgen -G "build-output/*.aab" > /dev/null; then
            echo "::error::No .aab found in build-output/ - native:package likely failed silently."
            echo "Re-running gradlew directly for a real error message:"
            (cd nativephp/android && ./gradlew bundleRelease --stacktrace) || true
            exit 1
          fi
          ls -la build-output/

      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build-output/*.aab
          retention-days: 14

  build-ios:
    name: Build iOS (unsigned upload)
    needs: determine-version
    # macos-15's Xcode doesn't have the UIWindow corner-adaptation API used by
    # plugin-nativephp-patch's ContentView.swift patch; macos-26 ships the
    # Xcode/SDK that supports it.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-nativephp-build
        with:
          production-env: ${{ secrets.ALTUU_PRODUCTION_ENV }}
          app-id: org.binota.alt-uu
          app-version: ${{ needs.determine-version.outputs.version }}
          display-version: ${{ needs.determine-version.outputs.display_version }}
          ios-certificate-base64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          ios-provisioning-profile-base64: ${{ secrets.IOS_DISTRIBUTION_PROVISIONING_PROFILE_BASE64 }}
          app-store-api-key-base64: ${{ secrets.APP_STORE_API_KEY_P8_BASE64 }}
          android-keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          google-service-account-key-base64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_BASE64 }}

      - name: Install NativePHP iOS project
        run: rm -Rf nativephp/ios && php artisan native:install --force ios

      - name: Package signed iOS archive
        run: php artisan native:package ios --export-method=app-store --output=build-output --rebuild --no-tty

      # See the matching Android step: native:package can swallow a build
      # failure and still exit 0, so verify the artifact exists explicitly.
      - name: Verify IPA was produced
        run: |
          set -euo pipefail
          if ! compgen -G "build-output/*.ipa" > /dev/null; then
            echo "::error::No .ipa found in build-output/ - native:package likely failed silently. Archive/export contents:"
            find nativephp/ios/build -maxdepth 3 2>/dev/null || echo "(nativephp/ios/build does not exist)"
            exit 1
          fi
          ls -la build-output/

      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build-output/*.ipa
          retention-days: 14

  publish-android:
    name: Publish Android to Play Store (internal)
    needs: [determine-version, build-android]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    environment: release
    runs-on: macos-15
    outputs:
      version_code: ${{ steps.version_code.outputs.version_code }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-nativephp-build
        with:
          production-env: ${{ secrets.ALTUU_PRODUCTION_ENV }}
          app-id: org.binota.alt_uu
          app-version: ${{ needs.determine-version.outputs.version }}
          display-version: ${{ needs.determine-version.outputs.display_version }}
          ios-certificate-base64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          ios-provisioning-profile-base64: ${{ secrets.IOS_DISTRIBUTION_PROVISIONING_PROFILE_BASE64 }}
          app-store-api-key-base64: ${{ secrets.APP_STORE_API_KEY_P8_BASE64 }}
          android-keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          google-service-account-key-base64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_BASE64 }}

      - name: Install NativePHP Android project
        run: rm -Rf nativephp/android && php artisan native:install --force android

      # The bundle's identity ("<version>b<version_code>") is what devices compare
      # to decide whether to re-extract the embedded Laravel app, so .env must
      # carry a fresh NATIVEPHP_APP_VERSION_CODE. native:package only bumps it
      # from the Play Store when GOOGLE_SERVICE_ACCOUNT_KEY is set in .env; pass
      # the decoded key explicitly so this never silently depends on that.
      - name: Sync build number with Play Store
        run: |
          set -euo pipefail
          php artisan native:check-build-number android --update --google-service-key=credentials/android/google-service-account.json --no-interaction
          code=$(grep -E '^NATIVEPHP_APP_VERSION_CODE=[0-9]+$' .env || true)
          if [ -z "$code" ]; then
            echo "::error::NATIVEPHP_APP_VERSION_CODE missing or non-numeric in .env after Play Store sync; devices would not re-extract the bundle."
            exit 1
          fi
          echo "$code"

      # Exposed so the sideload APK job reuses the exact same version code.
      - name: Export version code
        id: version_code
        run: |
          set -euo pipefail
          code=$(sed -nE 's/^NATIVEPHP_APP_VERSION_CODE=([0-9]+)$/\1/p' .env | tail -n1)
          echo "version_code=${code}" >> "$GITHUB_OUTPUT"

      - name: Package, sign and upload to Play Store internal testing
        # No --jump-by here: Play Store's build-number lookup already scans every
        # edit/track across the whole app (see PublishesToPlayStore::getLatestPlayStoreVersionCode),
        # so "latest + 1" is always safe regardless of version name.
        run: php artisan native:package android --build-type=bundle --output=build-output --upload-to-play-store --play-store-track=internal --rebuild --no-tty

      # native:package can swallow a Gradle/upload failure and still exit 0
      # (its error paths return without setting Command::FAILURE), so check
      # for the artifact explicitly instead of trusting the step's exit code.
      - name: Verify AAB was produced and uploaded
        run: |
          set -euo pipefail
          if ! compgen -G "build-output/*.aab" > /dev/null; then
            echo "::error::No .aab found in build-output/ - native:package likely failed silently (Gradle build and/or Play Store upload)."
            echo "Re-running gradlew directly for a real error message:"
            (cd nativephp/android && ./gradlew bundleRelease --stacktrace) || true
            exit 1
          fi
          ls -la build-output/

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-signed
          path: build-output/*.aab
          retention-days: 90

  # Signed with a dedicated sideload key (NOT the Play upload key), so it is a
  # separate install channel from the Play Store build. Runs after the Play
  # publish (and its approval) and reuses that build's version code.
  build-android-sideload:
    name: Build Android sideload APK
    needs: [determine-version, publish-android]
    runs-on: macos-15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-nativephp-build
        with:
          production-env: ${{ secrets.ALTUU_PRODUCTION_ENV }}
          app-id: org.binota.alt_uu
          app-version: ${{ needs.determine-version.outputs.version }}
          display-version: ${{ needs.determine-version.outputs.display_version }}
          ios-certificate-base64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          ios-provisioning-profile-base64: ${{ secrets.IOS_DISTRIBUTION_PROVISIONING_PROFILE_BASE64 }}
          app-store-api-key-base64: ${{ secrets.APP_STORE_API_KEY_P8_BASE64 }}
          android-keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          google-service-account-key-base64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_BASE64 }}

      - name: Install NativePHP Android project
        run: rm -Rf nativephp/android && php artisan native:install --force android

      - name: Pin version code to the Play build
        run: |
          set -euo pipefail
          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::Missing version code from publish-android."
            exit 1
          fi
          grep -vE '^NATIVEPHP_APP_VERSION_CODE=' .env > .env.tmp || true
          mv .env.tmp .env
          printf 'NATIVEPHP_APP_VERSION_CODE=%s\n' "$VERSION_CODE" >> .env
        env:
          VERSION_CODE: ${{ needs.publish-android.outputs.version_code }}

      - name: Decode sideload keystore
        run: |
          set -euo pipefail
          printf '%s' "$SIDELOAD_KEYSTORE" | base64 --decode > credentials/sideload.p12
        env:
          SIDELOAD_KEYSTORE: ${{ secrets.ANDROID_SIDELOAD_KEYSTORE_BASE64 }}

      - name: Package sideload APK
        run: |
          php artisan native:package android --build-type=release \
            --keystore=credentials/sideload.p12 \
            --keystore-password="$SIDELOAD_PASSWORD" \
            --key-password="$SIDELOAD_PASSWORD" \
            --key-alias="$SIDELOAD_ALIAS" \
            --output=build-output --rebuild --no-tty
        env:
          SIDELOAD_PASSWORD: ${{ secrets.ANDROID_SIDELOAD_KEYSTORE_PASSWORD }}
          SIDELOAD_ALIAS: ${{ secrets.ANDROID_SIDELOAD_KEY_ALIAS }}

      # native:package can swallow failures and still exit 0, and could fall
      # back to the Play upload key from .env. Check the artifact exists and
      # that it is signed with the sideload key, not the upload key.
      - name: Verify APK and signing certificate
        run: |
          set -euo pipefail
          if ! compgen -G "build-output/*.apk" > /dev/null; then
            echo "::error::No .apk found in build-output/ - native:package likely failed silently."
            exit 1
          fi
          apk=$(ls build-output/*.apk | head -n1)
          mv "$apk" build-output/alt-uu-sideload.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$apksigner" verify --print-certs build-output/alt-uu-sideload.apk | tee certs.txt
          actual=$(sed -nE 's/.*certificate SHA-256 digest: ([0-9a-f]+).*/\1/p' certs.txt | head -n1 | tr -d ':' | tr 'a-f' 'A-F')
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::APK is not signed with the sideload key (got $actual)."
            exit 1
          fi
        env:
          EXPECTED_SHA256: E45CA611489F0DF8A957458206C015FF7B6131ACB7308F693D2B75BE3AA2DD9D

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: build-output/alt-uu-sideload.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-sideload-apk
          path: build-output/alt-uu-sideload.apk
          retention-days: 90

  publish-ios:
    name: Publish iOS to App Store Connect
    needs: [determine-version, build-ios]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    environment: release
    # See build-ios: macos-26 has the Xcode/SDK the native patch needs.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-nativephp-build
        with:
          production-env: ${{ secrets.ALTUU_PRODUCTION_ENV }}
          app-id: org.binota.alt-uu
          app-version: ${{ needs.determine-version.outputs.version }}
          display-version: ${{ needs.determine-version.outputs.display_version }}
          ios-certificate-base64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          ios-provisioning-profile-base64: ${{ secrets.IOS_DISTRIBUTION_PROVISIONING_PROFILE_BASE64 }}
          app-store-api-key-base64: ${{ secrets.APP_STORE_API_KEY_P8_BASE64 }}
          android-keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          google-service-account-key-base64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_BASE64 }}

      - name: Install NativePHP iOS project
        run: rm -Rf nativephp/ios && php artisan native:install --force ios

      # native:package only asks App Store Connect for the next build number
      # *after* it has already zipped the Laravel app, so the bundle's identity
      # ("<version>b<version_code>", which decides whether devices re-extract
      # the embedded app) must be settled in .env beforehand.
      #
      # App Store Connect's lookup only covers builds of this exact version
      # string, and the check command ignores --jump-by on iOS. So:
      #   - clear the inherited code, then let the command write latest + 1
      #     if the store knows this version;
      #   - add jump_by on top in that case (same maths as native:package);
      #   - if the store has never seen this version, nothing is written, so
      #     fall back to jump_by + 1 instead of a stale/default code.
      # (Android needs no such handling: Play Store's lookup spans all builds.)
      - name: Sync build number with App Store Connect
        run: |
          set -euo pipefail
          jump_by="${JUMP_BY:-0}"
          grep -vE '^NATIVEPHP_APP_VERSION_CODE=' .env > .env.tmp || true
          mv .env.tmp .env

          php artisan altuu:check-build-number ios --update --no-interaction

          store_code=$(sed -nE 's/^NATIVEPHP_APP_VERSION_CODE=([0-9]+)$/\1/p' .env | tail -n1)
          if [ -n "$store_code" ]; then
            code=$((store_code + jump_by))
          else
            echo "App Store Connect has no builds for this version; starting from jump_by + 1"
            code=$((1 + jump_by))
          fi

          grep -vE '^NATIVEPHP_APP_VERSION_CODE=' .env > .env.tmp || true
          mv .env.tmp .env
          printf 'NATIVEPHP_APP_VERSION_CODE=%s\n' "$code" >> .env
          echo "NATIVEPHP_APP_VERSION_CODE=$code"
        env:
          JUMP_BY: ${{ inputs.jump_by }}

      - name: Package, sign and upload to App Store Connect
        # macOS runners ship bash 3.2, where "${arr[@]}" on a *declared but
        # empty* array trips `set -u`'s unbound-variable check (fixed upstream
        # only in bash 4.4+). Guard the expansion with a length check instead
        # of relying on the array being safely empty-expandable.
        run: |
          set -euo pipefail
          jump_by_flag=()
          if [ -n "${JUMP_BY:-}" ]; then
            jump_by_flag=(--jump-by="$JUMP_BY")
          fi
          if [ "${#jump_by_flag[@]}" -gt 0 ]; then
            php artisan native:package ios --export-method=app-store --output=build-output --upload-to-app-store --rebuild --no-tty "${jump_by_flag[@]}"
          else
            php artisan native:package ios --export-method=app-store --output=build-output --upload-to-app-store --rebuild --no-tty
          fi
        env:
          JUMP_BY: ${{ inputs.jump_by }}

      # See the matching Android step: native:package can swallow a build or
      # upload failure and still exit 0, so verify the artifact exists explicitly.
      - name: Verify IPA was produced and uploaded
        run: |
          set -euo pipefail
          if ! compgen -G "build-output/*.ipa" > /dev/null; then
            echo "::error::No .ipa found in build-output/ - native:package likely failed silently (build and/or App Store Connect upload). Archive/export contents:"
            find nativephp/ios/build -maxdepth 3 2>/dev/null || echo "(nativephp/ios/build does not exist)"
            exit 1
          fi
          ls -la build-output/

      - uses: actions/upload-artifact@v4
        with:
          name: ios-release-signed
          path: build-output/*.ipa
          retention-days: 90

  github-release:
    name: Create GitHub release
    needs:
      [determine-version, publish-android, publish-ios, build-android-sideload]
    if: always() && needs.publish-android.result == 'success' && needs.publish-ios.result == 'success' && needs.build-android-sideload.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: android-release-signed
          path: release-assets

      - uses: actions/download-artifact@v4
        with:
          name: ios-release-signed
          path: release-assets

      - uses: actions/download-artifact@v4
        with:
          name: android-sideload-apk
          path: release-assets

      # The AAB/IPA are re-signed by Google/Apple on their way to users, so
      # these attest what CI produced, not what the stores serve. The APK is
      # attested in its own job and is what users can verify end to end.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release-assets/*.aab
            release-assets/*.ipa

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.determine-version.outputs.version }}
          DISPLAY_VERSION: ${{ needs.determine-version.outputs.display_version }}
        run: |
          gh release create "mobile-v${VERSION}-${{ github.run_number }}" \
            release-assets/*.aab release-assets/*.ipa release-assets/*.apk \
            --title "Mobile release ${DISPLAY_VERSION} (build ${{ github.run_number }})" \
            --notes "Automated mobile release from commit ${{ github.sha }}. Uploaded to Play Store internal testing and App Store Connect. The APK is a separate sideload build; see the README for how to verify it." \
            --target "${{ github.sha }}"
